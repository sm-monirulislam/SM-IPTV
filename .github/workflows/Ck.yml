name: Auto Update Playlist and Logos

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python Script
        run: python merge_and_download_images.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "sm-monirulislam"
          git config --global user.email "action@github.com"
          git add images/ Sports_data.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update downloaded logos and merged playlist [skip ci]" && git push)
